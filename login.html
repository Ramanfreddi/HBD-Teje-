<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="color-scheme" content="only light">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlock the Birthday Surprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;color:#654465;font-family:Quicksand,system-ui,sans-serif;background:radial-gradient(circle at 15% 15%,#fff 0 7%,transparent 28%),radial-gradient(circle at 85% 80%,#fff3bd 0 2%,transparent 24%),linear-gradient(135deg,#ffe3f0,#e8e3ff 55%,#dff6ff);overflow:hidden}.orb{position:fixed;width:33vmax;aspect-ratio:1;border-radius:50%;filter:blur(42px);opacity:.34;pointer-events:none}.orb.one{top:-18vmax;left:-12vmax;background:#ff8ec5}.orb.two{right:-16vmax;bottom:-19vmax;background:#8bdcff}.card{width:min(100%,460px);position:relative;padding:36px;border:1px solid rgba(255,255,255,.9);border-radius:32px;background:rgba(255,255,255,.6);box-shadow:0 25px 70px rgba(104,62,130,.2);backdrop-filter:blur(15px);text-align:center}.lock{display:grid;place-items:center;width:62px;height:62px;margin:auto;border-radius:21px;font-size:1.9rem;background:linear-gradient(135deg,#ff72b2,#9e7de2);box-shadow:0 10px 22px rgba(178,92,160,.28)}h1{margin:16px 0 6px;font-family:'Dancing Script',cursive;font-size:clamp(2.55rem,10vw,4rem);line-height:1;color:#ed59a8;text-shadow:0 3px #fff}p{line-height:1.5}.sub{margin:0 0 22px}.tabs{display:flex;padding:4px;margin-bottom:20px;border-radius:15px;background:rgba(242,224,246,.78)}.tab{flex:1;border:0;border-radius:11px;padding:10px;cursor:pointer;color:#815482;background:transparent;font:700 .95rem Quicksand,sans-serif}.tab.active{color:#d94b98;background:#fff;box-shadow:0 3px 9px rgba(112,63,125,.12)}form{text-align:left}.field{margin:13px 0}.field label{display:block;margin:0 0 6px;font-size:.86rem;font-weight:700;color:#805281}.field input{width:100%;padding:13px 14px;border:2px solid transparent;border-radius:14px;outline:0;color:#60435f;background:rgba(255,255,255,.8);font:600 1rem Quicksand,sans-serif;transition:border .2s,box-shadow .2s}.field input:focus{border-color:#e78ac2;box-shadow:0 0 0 4px rgba(240,128,187,.15)}.row{display:flex;justify-content:flex-end;margin:-3px 0 15px}.link{border:0;padding:0;color:#8b62d6;background:none;cursor:pointer;font:700 .84rem Quicksand,sans-serif}.submit,.google{width:100%;min-height:48px;border:0;border-radius:14px;cursor:pointer;font:700 1rem Quicksand,sans-serif}.submit{color:#fff;background:linear-gradient(100deg,#ff5fa8,#9472df);box-shadow:0 8px 18px rgba(175,91,156,.25)}.submit:disabled,.google:disabled{opacity:.62;cursor:wait}.divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:#a2849f;font-size:.8rem;font-weight:700}.divider::before,.divider::after{content:'';height:1px;flex:1;background:#e7cfe0}.google{display:flex;align-items:center;justify-content:center;gap:10px;color:#6c4d6a;background:#fff;box-shadow:0 5px 15px rgba(108,57,122,.1)}.google b{display:grid;place-items:center;width:21px;height:21px;border-radius:50%;color:#fff;background:conic-gradient(#4285f4 0 25%,#34a853 0 50%,#fbbc05 0 75%,#ea4335 0)}.notice{min-height:22px;margin:15px 0 0;text-align:center;font-size:.89rem;font-weight:700}.notice.error{color:#c34278}.notice.success{color:#538d68}.terms{margin:17px 0 0;color:#987c96;font-size:.76rem}@media(max-width:460px){body{padding:14px}.card{padding:29px 21px;border-radius:26px}}
  </style>
</head>
<body><span class="orb one"></span><span class="orb two"></span><main class="card"><div class="lock">🎁</div><h1>Just for you</h1><p class="sub" id="headingText">Sign in to unlock the birthday surprise.</p><div class="tabs" role="tablist"><button class="tab active" id="signinTab" type="button" role="tab">Sign in</button><button class="tab" id="signupTab" type="button" role="tab">Create account</button></div><form id="authForm" novalidate><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="At least 6 characters" required></div><div class="field" id="confirmField" hidden><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Type it once more"></div><div class="row" id="forgotRow"><button class="link" id="forgot" type="button">Forgot password?</button></div><button class="submit" id="submit" type="submit">Sign in</button></form><div class="divider">or</div><button class="google" id="google" type="button"><b>G</b> Continue with Google</button><p class="notice" id="notice" role="status" aria-live="polite"></p><p class="terms">By continuing, you agree to use this birthday space kindly. 💗</p></main>
<script type="module">
  import { GoogleAuthProvider, createUserWithEmailAndPassword, getRedirectResult, onAuthStateChanged, sendPasswordResetEmail, signInWithEmailAndPassword, signInWithPopup, signInWithRedirect, updateProfile } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
  import { auth } from './firebase-config.js';
  const $=id=>document.getElementById(id),form=$('authForm'),notice=$('notice'),submit=$('submit'),google=$('google');let signup=false;
  const next=new URLSearchParams(location.search).get('next');const destination=next&&/^[a-zA-Z0-9_-]+\.html(?:\?.*)?$/.test(next)?next:'index.html';
  function setNotice(text,type=''){notice.textContent=text;notice.className='notice '+type}function busy(value){submit.disabled=value;google.disabled=value;submit.textContent=value?'Please wait…':signup?'Create account':'Sign in'}
  function setMode(isSignup){signup=isSignup;$('signinTab').classList.toggle('active',!signup);$('signupTab').classList.toggle('active',signup);$('confirmField').hidden=!signup;$('forgotRow').hidden=signup;$('headingText').textContent=signup?'Create an account to keep your birthday space private.':'Sign in to unlock the birthday surprise.';$('password').autocomplete=signup?'new-password':'current-password';submit.textContent=signup?'Create account':'Sign in';setNotice('')}
  $('signinTab').onclick=()=>setMode(false);$('signupTab').onclick=()=>setMode(true);
  function readable(error){const code=error?.code||'';if(code.includes('invalid-credential')||code.includes('wrong-password')||code.includes('user-not-found'))return 'That email or password is not correct.';if(code.includes('email-already-in-use'))return 'An account already uses that email.';if(code.includes('weak-password'))return 'Please choose a password with at least 6 characters.';if(code.includes('popup-closed'))return 'Google sign-in was closed before it finished.';if(code.includes('operation-not-allowed'))return 'This sign-in method is not enabled in Firebase yet.';if(code.includes('too-many-requests'))return 'Too many attempts. Please try again later.';return 'Something went wrong. Please try again.'}
  form.addEventListener('submit',async e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value;if(!form.reportValidity())return;if(signup&&password!==$('confirmPassword').value){setNotice('Your passwords do not match.','error');return}busy(true);setNotice('');try{const credential=signup?await createUserWithEmailAndPassword(auth,email,password):await signInWithEmailAndPassword(auth,email,password);if(signup)await updateProfile(credential.user,{displayName:email.split('@')[0]});location.assign(destination)}catch(error){setNotice(readable(error),'error');busy(false)}});
  $('forgot').onclick=async()=>{const email=$('email').value.trim();if(!email){setNotice('Enter your email first, then choose Forgot password.','error');$('email').focus();return}try{await sendPasswordResetEmail(auth,email);setNotice('Password reset email sent. Check your inbox.','success')}catch(error){setNotice(readable(error),'error')}};
  google.onclick=async()=>{busy(true);setNotice('');try{const provider=new GoogleAuthProvider();if(matchMedia('(pointer:coarse)').matches){await signInWithRedirect(auth,provider);return}await signInWithPopup(auth,provider);location.assign(destination)}catch(error){setNotice(readable(error),'error');busy(false)}};
  getRedirectResult(auth).catch(error=>{setNotice(readable(error),'error');busy(false)});
  onAuthStateChanged(auth,user=>{if(user)location.replace(destination)});
</script></body></html>
