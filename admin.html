<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account approvals</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:32px;color:#49384d;font:16px system-ui,sans-serif;background:#faf2f8}main{width:min(100%,860px);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}h1{margin:0;color:#bd3f86}.subtitle{color:#765f71}.signout,.approve{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font:700 .9rem system-ui}.signout{color:#765f71;background:#fff}.list{display:grid;gap:12px}.user{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px;border-radius:16px;background:#fff;box-shadow:0 4px 18px #71456313}.user p{margin:4px 0;color:#806a7c;font-size:.85rem;word-break:break-all}.approve{color:#fff;background:#8f62d3}.approve:disabled{opacity:.6;cursor:wait}.empty{padding:30px;text-align:center;border-radius:16px;background:#fff;color:#806a7c}[hidden]{display:none}
  </style>
</head>
<body>
  <main id="app" hidden>
    <div class="top"><div><h1>Account approvals</h1><p class="subtitle">Review people waiting to enter.</p></div><button class="signout" id="signOut">Sign out</button></div>
    <section class="list" id="list" aria-live="polite"></section>
  </main>
  <script type="module">
    import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
    import { collection, doc, getDoc, onSnapshot, query, updateDoc, where } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';
    import { auth, db } from './firebase-config.js';
    const app=document.getElementById('app'),list=document.getElementById('list');
    const escapeHtml=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    function render(snapshot){if(snapshot.empty){list.innerHTML='<div class="empty">No accounts are waiting for approval.</div>';return}list.innerHTML='';snapshot.forEach(item=>{const user=item.data(),row=document.createElement('article');row.className='user';row.innerHTML=`<div><strong>${escapeHtml(user.email || 'No email')}</strong><p>${escapeHtml(item.id)}</p></div><button class="approve" type="button">Approve</button>`;row.querySelector('button').onclick=async event=>{const button=event.currentTarget;button.disabled=true;button.textContent='Approving…';try{await updateDoc(doc(db,'users',item.id),{approved:true})}catch(error){console.error(error);button.disabled=false;button.textContent='Try again'}};list.append(row)})}
    onAuthStateChanged(auth,async user=>{if(!user){location.replace('login.html');return}try{const profile=await getDoc(doc(db,'users',user.uid));if(!profile.exists()||profile.data().role!=='admin'){location.replace(profile.exists()&&profile.data().approved===true?'index.html':'pending-approval.html');return}app.hidden=false;onSnapshot(query(collection(db,'users'),where('approved','==',false)),render,error=>{console.error(error);list.innerHTML='<div class="empty">Unable to load pending accounts.</div>'})}catch(error){console.error(error);location.replace('login.html')}});
    document.getElementById('signOut').onclick=()=>signOut(auth);
  </script>
</body>
</html>
