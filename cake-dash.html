<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="color-scheme" content="only light">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cake Dash</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box} body{min-height:100vh;margin:0;padding:20px;display:grid;place-items:center;font-family:Fredoka,system-ui,sans-serif;color:#71436f;background:radial-gradient(circle at 12% 10%,#fff 0 5%,transparent 25%),linear-gradient(135deg,#fff0f8,#e6f8ff 55%,#fff4d9)}
    .card{width:min(96vw,820px);position:relative;padding:22px;text-align:center;border:1px solid rgba(255,255,255,.9);border-radius:32px;background:rgba(255,255,255,.58);box-shadow:0 25px 70px rgba(104,62,130,.18);backdrop-filter:blur(12px)}
    .back{position:absolute;top:18px;left:21px;color:#8e65d7;text-decoration:none;font-size:.93rem;font-weight:700}h1{margin:24px 0 3px;color:#f65aa6;font-size:clamp(2.05rem,6vw,3.25rem);text-shadow:0 3px 0 #fff}.intro{margin:0 0 15px}
    .stats{display:flex;justify-content:center;gap:12px;margin-bottom:14px}.stat{min-width:110px;padding:7px 15px;border-radius:16px;background:#fffafd;box-shadow:0 5px 13px rgba(108,57,122,.1)}.stat b{display:block;color:#f65aa6;font-size:1.28rem}
    .game-wrap{position:relative;margin:auto;width:min(100%,740px);overflow:hidden;border:3px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:inset 0 0 0 2px rgba(220,142,202,.2),0 11px 25px rgba(118,78,136,.13)}canvas{display:block;width:100%;height:auto;background:#fff8fd;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-content:center;padding:28px;background:rgba(255,255,255,.79);backdrop-filter:blur(5px)}.overlay.hidden{display:none}.overlay h2{margin:0;color:#f65aa6;font-size:clamp(2rem,6vw,3rem)}.overlay p{max-width:420px;margin:10px auto 18px;line-height:1.45}.play{border:0;border-radius:999px;padding:12px 25px;cursor:pointer;color:#fff;background:linear-gradient(100deg,#ff60aa,#9473dd);font:700 1rem Fredoka,sans-serif;box-shadow:0 7px 18px rgba(175,91,156,.25);transition:transform .2s}.play:hover{transform:translateY(-3px)}
    .controls{display:flex;justify-content:center;gap:10px;margin-top:14px}.controls button{width:53px;height:45px;border:0;border-radius:15px;cursor:pointer;color:#7a4d80;background:rgba(255,255,255,.82);box-shadow:0 5px 12px rgba(108,57,122,.12);font-size:1.35rem}.controls button:active{transform:translateY(2px);background:#fff0f8}@media(min-width:700px){.controls{display:none}}@media(max-width:480px){body{padding:10px}.card{padding:16px 10px;border-radius:24px}h1{margin-top:42px}.stats{gap:7px}.stat{min-width:88px;padding:6px 8px}.game-wrap{border-radius:18px}}
  </style>
  <link rel="stylesheet" href="mobile-webview.css">
</head>
<body><main class="card"><a class="back" href="games.html">&larr; Back to games</a><h1>Cake Dash 🎂</h1><p class="intro">Collect every sprinkle, dodge the candles, and reach the birthday cake!</p><div class="stats"><div class="stat">Level <b id="level">1 / 3</b></div><div class="stat">Treats <b id="treats">0 / 10</b></div><div class="stat">Lives <b id="lives">❤❤❤</b></div></div><div class="game-wrap"><canvas id="game" width="740" height="430" aria-label="Cake Dash game"></canvas><div class="overlay" id="overlay"><div><h2 id="overlayTitle">Ready, set, dash!</h2><p id="overlayText">Use the arrow keys or the buttons below. Collect all the treats, avoid candles, then touch the cake.</p><button class="play" id="play">Start game ✨</button></div></div></div><div class="controls" aria-label="Game controls"><button data-key="ArrowLeft" aria-label="Move left">←</button><button data-key="ArrowUp" aria-label="Move up">↑</button><button data-key="ArrowDown" aria-label="Move down">↓</button><button data-key="ArrowRight" aria-label="Move right">→</button></div></main>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),overlay=document.getElementById('overlay'),title=document.getElementById('overlayTitle'),copy=document.getElementById('overlayText'),play=document.getElementById('play'),levelEl=document.getElementById('level'),treatsEl=document.getElementById('treats'),livesEl=document.getElementById('lives');
const W=c.width,H=c.height,keys={},levels=[{count:8,speed:1.25},{count:11,speed:1.65},{count:14,speed:2.05}];let level=0,player,items,enemies,cake,lives,running,flash,raf;
function rand(a,b){return a+Math.random()*(b-a)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function setup(){const cfg=levels[level];player={x:55,y:H/2,r:18,inv:0};lives=3;items=Array.from({length:cfg.count},()=>({x:rand(90,W-80),y:rand(35,H-35),r:11,taken:false}));enemies=Array.from({length:level+2},(_,i)=>({x:rand(170,W-100),y:rand(50,H-50),r:16,vx:(Math.random()>.5?1:-1)*cfg.speed*(.8+Math.random()*.4),vy:(Math.random()>.5?1:-1)*cfg.speed*(.8+Math.random()*.4)}));cake={x:W-54,y:H/2,r:28};updateStats()}
function updateStats(){levelEl.textContent=(level+1)+' / 3';treatsEl.textContent=items.filter(i=>i.taken).length+' / '+items.length;livesEl.textContent='❤'.repeat(lives)+'♡'.repeat(3-lives)}
function circle(a,color){x.beginPath();x.arc(a.x,a.y,a.r,0,Math.PI*2);x.fillStyle=color;x.fill()}function draw(){x.clearRect(0,0,W,H);const bg=x.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#fff3fb');bg.addColorStop(1,'#e8f8ff');x.fillStyle=bg;x.fillRect(0,0,W,H);for(let i=0;i<22;i++){x.fillStyle='rgba(255,255,255,.65)';x.beginPath();x.arc((i*97)%W,(i*59)%H,2+(i%4),0,7);x.fill()}items.forEach(i=>{if(!i.taken){circle(i,'#ffbc55');x.fillStyle='#fff';x.font='16px sans-serif';x.fillText('✦',i.x-7,i.y+6)}});x.save();x.translate(cake.x,cake.y);circle({x:0,y:0,r:28},'#ff94c5');circle({x:-9,y:-9,r:9},'#fff5c7');circle({x:9,y:-9,r:9},'#fff5c7');x.fillStyle='#71436f';x.font='27px sans-serif';x.fillText('🎂',-17,10);x.restore();enemies.forEach(e=>{circle(e,'#ff8c74');x.fillStyle='#fff5bf';x.fillRect(e.x-3,e.y-25,6,14);x.fillStyle='#ffcc38';x.beginPath();x.arc(e.x,e.y-28,5,0,7);x.fill()});if(!player.inv||Math.floor(player.inv/5)%2===0){circle(player,'#8e72df');x.fillStyle='#fff';x.font='24px sans-serif';x.fillText('🧁',player.x-15,player.y+9)}if(flash>0){x.fillStyle='rgba(255,95,165,'+(flash/16)+')';x.fillRect(0,0,W,H)}}
function tick(){if(!running)return;const sp=4.1;if(keys.ArrowLeft)player.x-=sp;if(keys.ArrowRight)player.x+=sp;if(keys.ArrowUp)player.y-=sp;if(keys.ArrowDown)player.y+=sp;player.x=Math.max(player.r,Math.min(W-player.r,player.x));player.y=Math.max(player.r,Math.min(H-player.r,player.y));enemies.forEach(e=>{e.x+=e.vx;e.y+=e.vy;if(e.x<e.r||e.x>W-e.r)e.vx*=-1;if(e.y<e.r||e.y>H-e.r)e.vy*=-1});items.forEach(i=>{if(!i.taken&&dist(player,i)<player.r+i.r){i.taken=true;updateStats()}});if(player.inv>0)player.inv--;if(flash>0)flash--;if(player.inv===0&&enemies.some(e=>dist(player,e)<player.r+e.r-4)){lives--;player.inv=70;flash=16;updateStats();if(lives===0)return end('Oh no—those candles got you!','Give it another dash. Every great birthday hero needs a retry.')}if(items.every(i=>i.taken)&&dist(player,cake)<player.r+cake.r){if(level===2){level=0;return end('You made the birthday cake! 🎉','Three levels cleared. You are officially the Sprinkle Champion!')}level++;setup();showBetween('Level '+(level+1)+'!','More treats, faster candles. You have got this!')}draw();raf=requestAnimationFrame(tick)}
function showBetween(t,p){running=false;title.textContent=t;copy.textContent=p;play.textContent='Continue →';overlay.classList.remove('hidden')}function end(t,p){running=false;cancelAnimationFrame(raf);title.textContent=t;copy.textContent=p;play.textContent='Play again ✨';overlay.classList.remove('hidden')}function start(){if(level>2)level=0;setup();overlay.classList.add('hidden');running=true;cancelAnimationFrame(raf);tick()}play.onclick=start;addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){keys[e.key]=true;e.preventDefault()}});addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{keys[k]=true;e.preventDefault()});['pointerup','pointerleave','pointercancel'].forEach(evt=>b.addEventListener(evt,()=>keys[k]=false))});setup();draw();
</script></body></html>
